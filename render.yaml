# Render Blueprint (Infrastructure as Code).
# Frontend deploy tren VERCEL (xem client/vercel.json) -> tren Render CHI can service backend duoi day.
# (Block lessence-client giu lai neu ban muon deploy ca FE bang Docker tren Render; bo qua neu dung Vercel.)
# Secret danh dau sync:false phai tu dien trong dashboard (KHONG commit gia tri that).
services:
  - type: web
    name: lessence-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TRUST_PROXY
        value: 1
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CSRF_ENABLED
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # VietQR (sinh ma chuyen khoan)
      - key: VIETQR_BANK_BIN
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      # SMTP (email)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # eSMS.vn (OTP qua SMS) - optional neu dung reset qua SMS
      - key: ESMS_API_KEY
        sync: false
      - key: ESMS_SECRET_KEY
        sync: false
      - key: ESMS_BRAND_NAME
        sync: false
      - key: ESMS_OTP_TEMPLATE
        sync: false
      # Optional: rate-limit phan tan & giam sat loi
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # (Optional) Deploy FE bang Docker tren Render thay vi Vercel:
  - type: web
    name: lessence-client
    runtime: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    plan: starter
    envVars:
      - key: VITE_API_URL
        sync: false
