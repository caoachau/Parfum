name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server: #GitHub tạo một máy Ubuntu mới.Mọi lệnh đều chạy trên máy này.
    name: Server - lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 #Clone source code của repository xuống máy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm #Lưu cache
          cache-dependency-path: package-lock.json
      - run: npm ci #Cài đặt các dependencies được liệt kê trong package-lock.json
      - run: npm --workspace server run lint --if-present #Chạy linter để kiểm tra code của server
      - run: npm --workspace server run typecheck --if-present #Chạy typecheck để kiểm tra các lỗi liên quan đến kiểu dữ liệu trong code của server
      - run: npm --workspace server run test --if-present #Chạy các bài kiểm tra (tests/) để đảm bảo rằng code của server hoạt động đúng như mong đợi
      - run: npm --workspace server run build #Xây dựng (build) ứng dụng server, tạo ra các tệp tin cần thiết để triển khai ứng dụng.

  client:
    name: Client - lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace client run lint --if-present
      - run: npm --workspace client run typecheck --if-present
      - run: npm --workspace client run build
      - run: npm --workspace client run test --if-present

  docker:
    name: Build Docker images
    needs: [server, client] #Docker chỉ chạy khi server và client chạy thành công
    runs-on: ubuntu-latest
    if: github.event_name == 'push' #chỉ chạy khi có push lên nhánh main hoặc master
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: lessence-server:ci
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: lessence-client:ci
          build-args: VITE_API_URL=/api
