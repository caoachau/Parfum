# Stack chay local/prod: MongoDB + Redis + API (server) + web tinh (client qua nginx).
# Su dung: sao chep server/.env.example -> server/.env, dien gia tri, roi: docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # MONGO_URI duoc lay tu server/.env de Docker dung dung database hien co.
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:8080
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        # Browser goi cung origin; nginx se proxy /api sang service server.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo-data:
